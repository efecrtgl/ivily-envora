name: Özellik isteği / Feature request
description: Ivily Envora için yeni bir özellik önerin.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorunu çözüyor? / What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Önerilen çözüm / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Değerlendirilen alternatifler / Alternatives considered

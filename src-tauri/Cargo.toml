[package]
name = "ivily-envora"
version = "0.1.0"
description = "Ivily Envora — Windows için ortam değişkeni, PATH ve geliştirme ortamı yöneticisi"
authors = ["efecrtgl"]
license = "MIT"
repository = "https://github.com/efecrtgl/ivily-envora"
edition = "2021"
rust-version = "1.80"

[lib]
name = "envora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
